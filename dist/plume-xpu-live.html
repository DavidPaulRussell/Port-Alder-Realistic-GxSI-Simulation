<title>Plume XPU Live</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a dark stage, one slide at a time, a live instrument on every slide; numbers set wide and heavy. Single dark look by choice. */
:root {
  --stage: #0a0e15; --panel: #111722; --line: #222b3b; --ink: #e9edf4; --muted: #8893a7;
  --two: #8d9cf0; --five: #4cc4b2; --heat: #f0a23b; --good: #4cc4b2; --bad: #ff7a6b;
  --f-display: "Archivo", "Arial Black", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--stage); color: var(--ink); font: 15px/1.5 var(--f-display); font-stretch: 100%; overflow-x: hidden; }
button { font: inherit; color: inherit; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.deck { min-height: 100%; display: grid; grid-template-rows: auto 1fr auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px; gap: 10px; max-width: 1280px; margin: 0 auto; }
.top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.brand { font-weight: 800; font-stretch: 125%; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; }
.hw { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 600 11px var(--f-mono); padding: 3px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.chip.on { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, transparent); }
.slide { display: grid; gap: 18px; align-content: start; min-width: 0; animation: in .35s ease-out; }
@keyframes in { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .slide { animation: none; } }
.eyebrow { font: 600 12px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--heat); }
h1, h2 { margin: 0; font-weight: 850; font-stretch: 112%; letter-spacing: -.01em; text-wrap: balance; line-height: 1.02; }
h1 { font-size: clamp(44px, 8vw, 104px); font-stretch: 125%; }
h2 { font-size: clamp(28px, 4.2vw, 52px); }
.lede { font-size: clamp(16px, 1.6vw, 20px); color: var(--muted); max-width: 62ch; margin: 0; font-weight: 400; }
.lede b { color: var(--ink); font-weight: 650; }
.cols { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 860px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.screen { background: #05070b; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; aspect-ratio: 1; max-width: 100%; position: relative; }
.screen canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.screen .tag { position: absolute; left: 10px; bottom: 10px; font: 500 12px var(--f-mono); background: #05070bcc; padding: 3px 7px; border-radius: 4px; color: var(--muted); }
.big { font-weight: 900; font-stretch: 125%; font-variant-numeric: tabular-nums; font-size: clamp(40px, 6vw, 78px); line-height: 1; }
.unit { font: 500 13px var(--f-mono); color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; }
.stat { display: grid; gap: 4px; }
.stat .label { font: 600 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.stat .v { font-weight: 850; font-stretch: 118%; font-size: clamp(26px, 3.2vw, 40px); font-variant-numeric: tabular-nums; line-height: 1.05; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 650; }
.btn:hover { border-color: var(--muted); }
.btn.go { background: var(--heat); border-color: var(--heat); color: #1a1206; }
.btn:disabled { opacity: .5; cursor: progress; }
button:focus-visible { outline: 2px solid var(--heat); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.note { color: var(--muted); font-size: 13.5px; margin: 0; max-width: 70ch; }

/* bit grid */
.bits { display: grid; grid-template-columns: 2.4em repeat(20, minmax(0, 1fr)); gap: 3px; font: 11px var(--f-mono); color: var(--muted); }
.bits i { aspect-ratio: 1; border-radius: 2px; background: #1a2130; display: block; }
.bits i.on { background: var(--two); }
.bits i.p0.on { background: var(--ink); }
.bits i.flip { box-shadow: 0 0 0 2px var(--heat) inset; }

/* chain */
.chain { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 860px) { .chain { grid-template-columns: minmax(0, 1fr); } }
.node { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 6px; min-height: 132px; align-content: start; background: var(--panel); transition: border-color .3s, box-shadow .3s; }
.node.xpu { background: transparent; border-style: dashed; }
.node.live { border-color: var(--heat); box-shadow: 0 0 0 1px var(--heat), 0 0 28px -8px var(--heat); }
.node.done { border-color: color-mix(in srgb, var(--good) 55%, transparent); }
.node .n { font-weight: 850; font-stretch: 120%; font-size: 22px; }
.node .r { font: 600 11px var(--f-mono); }
.node .d { font: 12px var(--f-mono); color: var(--muted); overflow-wrap: anywhere; }

/* race */
.lanes { display: grid; gap: 14px; }
.lane { display: grid; grid-template-columns: minmax(150px, 220px) minmax(0, 1fr) minmax(120px, 170px); gap: 14px; align-items: center; }
@media (max-width: 760px) { .lane { grid-template-columns: minmax(0, 1fr); gap: 6px; } }
.lane .who { font-weight: 700; } .lane .who small { display: block; font: 12px var(--f-mono); color: var(--muted); font-weight: 400; }
.track { height: 26px; border-radius: 6px; background: #161d2a; overflow: hidden; position: relative; }
.fill { position: absolute; inset: 0 auto 0 0; width: 0%; background: linear-gradient(90deg, color-mix(in srgb, var(--heat) 40%, transparent), var(--heat)); transition: width .12s linear; }
.lane.gpu .fill { background: linear-gradient(90deg, color-mix(in srgb, var(--two) 40%, transparent), var(--two)); }
.lane.js .fill { background: linear-gradient(90deg, #4a5468, #8893a7); }
.lane .res { font: 600 13px var(--f-mono); text-align: right; }
.lane .res small { display: block; color: var(--muted); font-weight: 400; }
.ok { color: var(--good); } .bad { color: var(--bad); }

/* hologram layers */
.layers { display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 4px; align-items: end; height: 190px; }
.layers div { display: grid; grid-template-rows: 1fr auto; gap: 4px; height: 100%; }
.layers b { display: block; border-radius: 3px 3px 0 0; background: #1a2130; align-self: end; transition: background .25s; }
.layers b.ok { background: var(--five); } .layers b.run { background: var(--heat); } .layers b.bad { background: var(--bad); }
.layers span { font: 10px var(--f-mono); color: var(--muted); text-align: center; }

/* trust */
.trials { display: grid; gap: 10px; }
.trial { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; background: var(--panel); }
.trial .what { font-weight: 700; } .trial .why { grid-column: 1 / -1; font: 12.5px var(--f-mono); color: var(--muted); overflow-wrap: anywhere; }
.verdict { font: 700 13px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; }

/* scoreboard */
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { font: 600 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
td.num, th.num { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
td.hi { color: var(--heat); font-weight: 700; }
.claims { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.claims div { border-top: 2px solid var(--line); padding-top: 10px; }
.claims h3 { margin: 0 0 6px; font-size: 15px; font-weight: 750; }
.claims ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; display: grid; gap: 4px; }

/* nav */
.nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dots button { width: 28px; height: 6px; border-radius: 3px; border: 0; background: var(--line); cursor: pointer; padding: 0; }
.dots button[aria-current="true"] { background: var(--heat); }
.keys { font: 12px var(--f-mono); color: var(--muted); }
</style>

<div class="deck">
  <div class="top">
    <span class="brand">Plume XPU · live</span>
    <div class="hw" id="hw"><span class="chip">detecting hardware…</span></div>
  </div>
  <main id="stage"></main>
  <div class="nav">
    <button class="btn" id="prev" aria-label="Previous slide">← Back</button>
    <div class="dots" id="dots" aria-label="Slides"></div>
    <span class="keys">← → or space</span>
    <button class="btn go" id="next" aria-label="Next slide">Next →</button>
  </div>
</div>

<script type="module">
const __mod_lcufa = (() => {
// LCUF-A/0.3 — the LCUF array profile (ByteFoundry virtual XPU).
// SPDX-License-Identifier: MIT OR GPL-3.0-only
//
// An LCUF-style column language whose values are whole frames: 8 lanes x 128 x 128
// words in the ring Z/p^n. It plays the role NumPy plays for Python: each row is one
// array operation that a native backend runs over the whole frame.
//
//   LCUF-A/0.3
//   module <name>
//   ring p=<prime> n=<digits>
//   frame lanes=8 height=128 width=128
//   phase | id | op | inputs | output | arg
//   init  | i1 | from2 | in | x | -
//   step  | s1 | life  | x  | lo | -
//   ...
//   final | f1 | to2   | x  | out | -
//   end
//
// Phases: init runs once, step runs n times, final runs once. `in` is the input
// frame; the program must write `out`. Names are registers; a row's output must
// differ from its inputs (the GPU cannot alias a written buffer).

const LCUFA_LANGUAGE = "LCUF-A/0.3";
const LANES = 8, HEIGHT = 128, WIDTH = 128, WORDS = LANES * HEIGHT * WIDTH;
const MAX_SLOTS = 16, MAX_ROWS = 256, MAX_SOURCE_CHARS = 65536, MAX_STEPS = 100000;
const LCUFA_COMPILER_VERSION = "0.3.2";
const COLUMNS = ["phase", "id", "op", "inputs", "output", "arg"];

// op name -> [code, inputs, takes const arg, neighbour access, description]
const OPS = {
  copy:  [1, 1, false, false, "copy a frame"],
  life:  [2, 1, false, true,  "Life rule on digit 0 of each lane (alive = digit 0 ≠ 0) → 0/1"],
  rot:   [3, 1, true,  false, "lane rotation: lane k takes lane (k + c) mod 8"],
  nsum:  [4, 1, false, true,  "Moore 8-neighbour sum, same lane, mod p^n"],
  sq:    [5, 1, false, false, "x² mod p^n"],
  mul:   [6, 2, false, false, "a·b mod p^n"],
  mulc:  [7, 1, true,  false, "a·c mod p^n"],
  add:   [8, 2, false, false, "a + b mod p^n"],
  addc:  [9, 1, true,  false, "a + c mod p^n"],
  orc:   [10, 1, true, false, "a ∨ c (p = 2 only)"],
  dadd:  [11, 2, false, false, "digit-wise addition mod p, no carries (XOR when p = 2)"],
  shift: [12, 1, false, false, "a·p mod p^n (moves every digit up one place)"],
  from2: [13, 1, false, false, "re-encode a 20-bit word: digit 0 = bit 0, digits 1.. = (x >> 1) mod p^(n−1)"],
  to2:   [14, 1, false, false, "decode to a 20-bit word: bit 0 = digit 0 mod 2, bits 1.. = x div p"],
  modj:  [15, 1, true,  false, "a mod p^c (pyramid level c)"],
};

class LcufaDiagnostic extends Error {
  constructor(message, line) { super(line ? `line ${line}: ${message}` : message); this.line = line; }
}
const fail = (m, l) => { throw new LcufaDiagnostic(m, l); };
const IDENT = /^[A-Za-z_][A-Za-z0-9_]{0,31}$/;
// names that collide with JavaScript object machinery are not register names
const RESERVED_NAMES = new Set(["__proto__", "constructor", "prototype", "undefined", "null", "hasOwnProperty", "toString", "valueOf"]);
const isName = (h) => IDENT.test(h) && !RESERVED_NAMES.has(h);
const isPrime = (p) => { if (p < 2) return false; for (let d = 2; d * d <= p; d++) if (p % d === 0) return false; return true; };

function parse(text) {
  if (typeof text !== "string") fail("source must be text");
  if (text.length > MAX_SOURCE_CHARS) fail(`source is longer than ${MAX_SOURCE_CHARS} characters`);
  const lines = text.replace(/\r\n?/g, "\n").split("\n");
  let i = 0;
  const next = () => { while (i < lines.length) { const raw = lines[i++]; const t = raw.trim(); if (t && !t.startsWith("#")) return [t, i]; } return [null, i]; };
  let [t, ln] = next();
  if (t !== LCUFA_LANGUAGE) fail(`first line must be ${LCUFA_LANGUAGE}`, ln);
  [t, ln] = next(); const mm = /^module ([A-Za-z_][A-Za-z0-9_.-]*)$/.exec(t || ""); if (!mm) fail("expected: module <name>", ln);
  [t, ln] = next(); const rm = /^ring p=([1-9][0-9]*) n=([1-9][0-9]*)$/.exec(t || ""); if (!rm) fail("expected: ring p=<prime> n=<digits> (decimal, no leading zeros, n ≥ 1)", ln);
  if (rm[1].length > 7 || rm[2].length > 2) fail("p or n is too large; p^n must fit in 21 bits", ln);
  const p = Number(rm[1]), n = Number(rm[2]);
  if (n < 1) fail("n must be at least 1", ln);
  if (p > 2 ** 21 || p ** n > 2 ** 21) fail(`p^n is larger than 2^21; the XPU word ring must fit in 21 bits`, ln);
  if (!isPrime(p)) fail(`p=${p} is not prime`, ln);
  if (p === 2 && n !== 20) fail("for p=2 the XPU ring is the Byte20 ring, n=20", ln);
  [t, ln] = next(); if (t !== "frame lanes=8 height=128 width=128") fail("expected: frame lanes=8 height=128 width=128", ln);
  [t, ln] = next(); if ((t || "").split("|").map((s) => s.trim()).join("|") !== COLUMNS.join("|")) fail(`expected column header: ${COLUMNS.join(" | ")}`, ln);
  const rows = []; const ids = new Set(); let ended = false; const order = { init: 0, step: 1, final: 2 }; let last = 0;
  for (;;) {
    [t, ln] = next(); if (t === null) break;
    if (t === "end") { ended = true; [t, ln] = next(); if (t !== null) fail("content after end", ln); break; }
    const cells = t.split("|").map((s) => s.trim());
    if (cells.length !== 6 || cells.some((c) => !c)) fail("a row needs six non-empty cells", ln);
    const [phase, id, op, ins, out, arg] = cells;
    if (!(phase in order)) fail(`phase must be init, step or final, not "${phase}"`, ln);
    if (order[phase] < last) fail("phases must appear in the order init, step, final", ln);
    last = order[phase];
    if (!IDENT.test(id) || ids.has(id)) fail(`row id "${id}" is invalid or repeated`, ln); ids.add(id);
    if (!(op in OPS)) fail(`unknown op "${op}"`, ln);
    const [, nin, takesC] = OPS[op];
    const inputs = ins === "-" ? [] : ins.split(",").map((s) => s.trim());
    if (inputs.length !== nin) fail(`${op} takes ${nin} input${nin > 1 ? "s" : ""}`, ln);
    for (const h of inputs) if (!isName(h)) fail(`bad or reserved input name "${h}"`, ln);
    if (!isName(out) || out === "in") fail(`bad or reserved output name "${out}"`, ln);
    if (inputs.includes(out)) fail(`output ${out} must differ from the inputs`, ln);
    let c = 0;
    if (takesC) { if (!/^[0-9]{1,10}$/.test(arg)) fail(`${op} needs a non-negative integer arg (at most 10 digits)`, ln); c = Number(arg); if (c > 0xffffffff) fail("arg too large", ln); }
    else if (arg !== "-") fail(`${op} takes no arg; write -`, ln);
    if (op === "orc" && p !== 2) fail("orc is a 2-adic operation; use p=2", ln);
    if (op === "rot" && c > 7) fail("rot arg must be 0..7", ln);
    if (op === "modj" && (c < 1 || c > n)) fail(`modj arg must be 1..${n}`, ln);
    // constants act in the ring: reduce them so every backend sees the same in-range value
    if (op === "addc" || op === "mulc" || op === "orc") c = c % p ** n;
    rows.push({ phase, id, op, inputs, output: out, c, line: ln });
  }
  if (!ended) fail("missing end");
  if (rows.length > MAX_ROWS) fail(`more than ${MAX_ROWS} rows`);
  return { language: LCUFA_LANGUAGE, module: mm[1], p, n, M: p ** n, rows };
}

// Static admission: definitions before use, `out` written, slot budget.
function compile(text) {
  const prog = parse(text);
  // Definitions before use. A step row may read a name written earlier in the same
  // iteration, or a name that already has a value from init.
  const defined = new Set(["in"]);
  for (const ph of ["init", "step", "final"]) {
    const known = new Set(defined);
    for (const r of prog.rows.filter((x) => x.phase === ph)) {
      for (const h of r.inputs) if (!known.has(h)) fail(`${h} is read before it is written${ph === "step" ? " (a step row can only read init values or rows above it)" : ""}`, r.line);
      known.add(r.output);
    }
    known.forEach((k) => defined.add(k));
  }
  if (!defined.has("out")) fail("the program never writes out");
  const names = ["in", ...[...defined].filter((x) => x !== "in")];
  if (names.length > MAX_SLOTS) fail(`${names.length} registers; the XPU has ${MAX_SLOTS} frame slots`);
  const slot = Object.assign(Object.create(null), Object.fromEntries(names.map((nm, k) => [nm, k])));
  const code = new Uint32Array(prog.rows.length * 5);
  prog.rows.forEach((r, k) => {
    code.set([OPS[r.op][0], slot[r.output], slot[r.inputs[0]], r.inputs.length > 1 ? slot[r.inputs[1]] : 0, r.c], k * 5);
  });
  const count = (ph) => prog.rows.filter((r) => r.phase === ph).length;
  return { ...prog, slot, code, ninit: count("init"), nstep: count("step"), nfinal: count("final"), outSlot: slot.out };
}

/* ---------------- reference interpreter (independent of the C engine) ---------------- */
function referenceRun(compiled, input, steps, rule = { birth: 1 << 3, survive: 12 }) {
  const { p, n, M } = compiled;
  const regs = new Map([["in", Uint32Array.from(input)]]);
  const mod = (x) => ((x % M) + M) % M;
  const dadd = (a, b) => { let r = 0, pw = 1; for (let i = 0; i < n; i++) { r += ((a % p + b % p) % p) * pw; pw *= p; a = Math.floor(a / p); b = Math.floor(b / p); } return r; };
  const runRow = (r) => {
    const a = regs.get(r.inputs[0]), b = regs.get(r.inputs[1]), o = new Uint32Array(WORDS), c = r.c;
    const nb = (y, x) => { const out = []; for (const dy of [-1, 0, 1]) for (const dx of [-1, 0, 1]) if (dy || dx) out.push((((y + dy + HEIGHT) % HEIGHT) * WIDTH + ((x + dx + WIDTH) % WIDTH)) * LANES); return out; };
    switch (r.op) {
      case "copy": o.set(a); break;
      case "add": for (let i = 0; i < WORDS; i++) o[i] = mod(a[i] + b[i]); break;
      case "addc": for (let i = 0; i < WORDS; i++) o[i] = mod(a[i] + c); break;
      case "orc": for (let i = 0; i < WORDS; i++) o[i] = mod((a[i] | c) >>> 0); break;
      case "sq": for (let i = 0; i < WORDS; i++) o[i] = Number((BigInt(a[i]) * BigInt(a[i])) % BigInt(M)); break;
      case "mul": for (let i = 0; i < WORDS; i++) o[i] = Number((BigInt(a[i]) * BigInt(b[i])) % BigInt(M)); break;
      case "mulc": for (let i = 0; i < WORDS; i++) o[i] = Number((BigInt(a[i]) * BigInt(c)) % BigInt(M)); break;
      case "shift": for (let i = 0; i < WORDS; i++) o[i] = mod(a[i] * p); break;
      case "dadd": for (let i = 0; i < WORDS; i++) o[i] = p === 2 ? (a[i] ^ b[i]) >>> 0 : dadd(a[i], b[i]); break;
      case "modj": { const m = p ** c; for (let i = 0; i < WORDS; i++) o[i] = a[i] % m; break; }
      case "from2": for (let i = 0; i < WORDS; i++) o[i] = p === 2 ? mod(a[i]) : (a[i] & 1) + p * ((a[i] >>> 1) % (M / p)); break;
      case "to2": for (let i = 0; i < WORDS; i++) o[i] = p === 2 ? a[i] : (((a[i] % p) & 1) | ((Math.floor(a[i] / p) << 1) & 0xfffff)) >>> 0; break;
      case "rot": for (let cell = 0; cell < HEIGHT * WIDTH; cell++) for (let k = 0; k < LANES; k++) o[cell * LANES + k] = a[cell * LANES + ((k + c) & 7)]; break;
      case "nsum": case "life":
        for (let y = 0; y < HEIGHT; y++) for (let x = 0; x < WIDTH; x++) {
          const ns = nb(y, x), base = (y * WIDTH + x) * LANES;
          for (let k = 0; k < LANES; k++) {
            if (r.op === "nsum") { let s = 0; for (const q of ns) s += a[q + k]; o[base + k] = mod(s); }
            else { let live = 0; for (const q of ns) live += (a[q + k] % p) !== 0 ? 1 : 0; const alive = (a[base + k] % p) !== 0; o[base + k] = alive ? (rule.survive >> live) & 1 : (rule.birth >> live) & 1; }
          }
        }
        break;
    }
    regs.set(r.output, o);
  };
  const ph = (name) => compiled.rows.filter((r) => r.phase === name);
  ph("init").forEach(runRow);
  for (let s = 0; s < steps; s++) ph("step").forEach(runRow);
  ph("final").forEach(runRow);
  return regs.get("out");
}

/* ---------------- WGSL kernel (one generic shader, one dispatch per row) ---------------- */

  $("stage").querySelectorAll("[data-next]").forEach((b) => b.addEventListener("click", () => show(current + 1)));
  [...$("dots").children].forEach((d, k) => d.setAttribute("aria-current", String(k === current)));
  $("prev").disabled = current === 0; $("next").disabled = current === SLIDES.length - 1;
  try { history.replaceState(null, "", "#" + s.id); } catch {}
  s.run(ok).catch((e) => { if (ok()) { const n = document.createElement("p"); n.className = "note bad"; n.textContent = "Stopped: " + e.message; $("stage").firstElementChild.append(n); } });
}
$("dots").innerHTML = SLIDES.map((s, i) => `<button aria-label="Slide ${i + 1}: ${s.id}"></button>`).join("");
[...$("dots").children].forEach((d, i) => d.addEventListener("click", () => show(i)));
$("prev").addEventListener("click", () => show(current - 1));
$("next").addEventListener("click", () => show(current + 1));
addEventListener("keydown", (e) => { if (e.target.closest?.("input,textarea")) return; if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); show(current + 1); } if (e.key === "ArrowLeft") show(current - 1); });
addEventListener("hashchange", () => { const i = SLIDES.findIndex((s) => "#" + s.id === location.hash); if (i >= 0 && i !== current) show(i); });
show(Math.max(0, SLIDES.findIndex((s) => "#" + s.id === location.hash)));
</script>
